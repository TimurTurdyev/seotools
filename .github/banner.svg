<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="seotools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <g opacity="0.18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7dd3fc">
    <text x="48" y="48">&lt;title&gt;Executive chair EX-500&lt;/title&gt;</text>
    <text x="48" y="76">&lt;meta property="og:image" content="cover.jpg"&gt;</text>
    <text x="700" y="48">&lt;link rel="canonical" href="/catalog/ex-500"&gt;</text>
    <text x="700" y="76">&lt;script type="application/ld+json"&gt;</text>
    <text x="48" y="272">&lt;meta name="robots" content="max-snippet:120"&gt;</text>
    <text x="700" y="272">{"@type":"Product","offers":{...}}</text>
  </g>

  <rect x="48" y="118" width="6" height="72" rx="3" fill="url(#accent)"/>

  <text x="78" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="52" font-weight="700" fill="#f1f5f9">seotools</text>
  <text x="78" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#94a3b8">SEO-разметка head для любого PHP 8.2+ проекта, Laravel-слой из коробки</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">
    <rect x="78" y="216" width="70" height="30" rx="15" fill="#0f2536" stroke="#1e3a52"/>
    <text x="113" y="236" fill="#34d399">meta</text>
    <rect x="158" y="216" width="120" height="30" rx="15" fill="#0f2536" stroke="#1e3a52"/>
    <text x="218" y="236" fill="#38bdf8">Open Graph</text>
    <rect x="288" y="216" width="105" height="30" rx="15" fill="#0f2536" stroke="#1e3a52"/>
    <text x="340" y="236" fill="#7dd3fc">Twitter/X</text>
    <rect x="403" y="216" width="100" height="30" rx="15" fill="#0f2536" stroke="#1e3a52"/>
    <text x="453" y="236" fill="#a5b4fc">JSON-LD</text>
  </g>
</svg>
